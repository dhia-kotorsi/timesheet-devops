<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees - Timesheet DevOps</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="navbar">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="users.html">Users</a>
        <a class="nav-link" href="employes.html">Employees</a>
        <a class="nav-link" href="contrats.html">Contracts</a>
        <a class="nav-link" href="departements.html">Departments</a>
        <a class="nav-link" href="entreprises.html">Companies</a>
    </div>
    <div class="container">
        <div class="page-title">Employees</div>
        <div class="card">
            <div id="status" class="status"></div>
            <div id="table-wrapper" class="table-wrapper"></div>
        </div>
    </div>
    <script>
        const currentPage = window.location.pathname.split('/').pop();
        document.querySelectorAll('.nav-link').forEach(link => {
            if (link.getAttribute('href') === currentPage) {
                link.classList.add('active');
            }
        });

        async function loadEmployees() {
            const status = document.getElementById('status');
            const tableWrapper = document.getElementById('table-wrapper');
            status.innerHTML = `<div class="loading-box"><div class="spinner"></div><div>Loading employees...</div></div>`;
            tableWrapper.innerHTML = '';
            try {
                const response = await fetch('http://localhost:8082/timesheet-devops/employe/retrieve-all-employes');
                if (!response.ok) {
                    throw new Error(`Request failed with status ${response.status}`);
                }
                const data = await response.json();
                if (!Array.isArray(data) || data.length === 0) {
                    status.innerHTML = '';
                    tableWrapper.innerHTML = '<div class="empty-state">No employees were returned by the server.</div>';
                    return;
                }
                const rows = data.map(employee => `
                    <tr>
                        <td>${employee?.id ?? '-'}</td>
                        <td>${employee?.prenom ?? '-'}</td>
                        <td>${employee?.nom ?? '-'}</td>
                        <td>${employee?.email ?? '-'}</td>
                        <td>${employee?.departement?.nomDepartement ?? '-'}</td>
                    </tr>
                `).join('');
                tableWrapper.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Email</th>
                                <th>Department</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                `;
                status.innerHTML = '';
            } catch (error) {
                status.innerHTML = `<div class="status error">Unable to load employees. ${error.message}</div>`;
                tableWrapper.innerHTML = '';
            }
        }

        loadEmployees();
    </script>
</body>
</html>
