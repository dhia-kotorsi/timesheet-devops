<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Timesheet DevOps</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="navbar">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="users.html">Users</a>
        <a class="nav-link" href="employes.html">Employees</a>
        <a class="nav-link" href="contrats.html">Contracts</a>
        <a class="nav-link" href="departements.html">Departments</a>
        <a class="nav-link" href="entreprises.html">Companies</a>
    </div>
    <div class="container">
        <div class="page-title">Users</div>
        <div class="card">
            <div id="status" class="status"></div>
            <div id="table-wrapper" class="table-wrapper"></div>
            <div class="form-section">
                <h3>User CRUD</h3>
                <div class="form-grid">
                    <label>ID
                        <input id="user-id" type="number" placeholder="Leave empty to create">
                    </label>
                    <label>First Name
                        <input id="firstName" type="text" placeholder="User first name">
                    </label>
                    <label>Last Name
                        <input id="lastName" type="text" placeholder="User last name">
                    </label>
                    <label>Birth Date
                        <input id="dateNaissance" type="date">
                    </label>
                    <label>Role
                        <select id="role">
                            <option value="INGENIEUR">INGENIEUR</option>
                            <option value="ADMINISTRATEUR">ADMINISTRATEUR</option>
                            <option value="TECHNICIEN">TECHNICIEN</option>
                            <option value="CHEF_DEPARTEMENT">CHEF_DEPARTEMENT</option>
                        </select>
                    </label>
                </div>
                <div class="button-row">
                    <button id="createBtn" type="button">Create</button>
                    <button id="updateBtn" type="button" class="update">Update</button>
                    <button id="deleteBtn" type="button" class="delete">Delete</button>
                    <button id="resetBtn" type="button" class="clear">Clear</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const currentPage = window.location.pathname.split('/').pop();
        document.querySelectorAll('.nav-link').forEach(link => {
            if (link.getAttribute('href') === currentPage) {
                link.classList.add('active');
            }
        });

        const apiBase = getApiBase('user');
        const status = document.getElementById('status');
        const tableWrapper = document.getElementById('table-wrapper');
        const idInput = document.getElementById('user-id');
        const firstNameInput = document.getElementById('firstName');
        const lastNameInput = document.getElementById('lastName');
        const dateInput = document.getElementById('dateNaissance');
        const roleInput = document.getElementById('role');
        const createBtn = document.getElementById('createBtn');
        const updateBtn = document.getElementById('updateBtn');
        const deleteBtn = document.getElementById('deleteBtn');
        const resetBtn = document.getElementById('resetBtn');

        function showStatus(message, isError = false) {
            status.className = isError ? 'status error' : 'status';
            status.innerHTML = message;
        }
        function getApiBase(entity) {
            const hostname = window.location.hostname;
            const isLocal = hostname === 'localhost' || hostname === '127.0.0.1';
            const base = isLocal
                ? 'http://localhost:8082'
                : `${window.location.protocol}//${hostname.replace('-80.', '-8082.')}`;
            return `${base}/timesheet-devops/${entity}`;
        }        

        function clearForm() {
            idInput.value = '';
            firstNameInput.value = '';
            lastNameInput.value = '';
            dateInput.value = '';
            roleInput.value = 'INGENIEUR';
            showStatus('Form cleared. Select a row to edit or delete.', false);
        }

        function populateForm(row) {
            idInput.value = row.dataset.id || '';
            firstNameInput.value = row.dataset.firstName || '';
            lastNameInput.value = row.dataset.lastName || '';
            dateInput.value = row.dataset.date || '';
            roleInput.value = row.dataset.role || 'INGENIEUR';
            showStatus('Loaded user for edit/delete. Use Update or Delete below.', false);
        }

        function attachRowListeners() {
            document.querySelectorAll('#table-wrapper tbody tr').forEach(row => {
                row.addEventListener('click', () => populateForm(row));
            });
        }

        async function loadUsers() {
            showStatus(`<div class="loading-box"><div class="spinner"></div><div>Loading users...</div></div>`);
            tableWrapper.innerHTML = '';
            try {
                const response = await fetch(`${apiBase}/retrieve-all-users`);
                if (!response.ok) {
                    throw new Error(`Request failed with status ${response.status}`);
                }
                const data = await response.json();
                if (!Array.isArray(data) || data.length === 0) {
                    tableWrapper.innerHTML = '<div class="empty-state">No users were returned by the server.</div>';
                    showStatus('');
                    return;
                }
                const rows = data.map(user => `
                    <tr data-id="${user?.id ?? ''}" data-first-name="${user?.firstName ?? ''}" data-last-name="${user?.lastName ?? ''}" data-date="${user?.dateNaissance ?? ''}" data-role="${user?.role ?? ''}">
                        <td>${user?.id ?? '-'}</td>
                        <td>${user?.firstName ?? '-'}</td>
                        <td>${user?.lastName ?? '-'}</td>
                        <td><span class="badge ${user?.role ?? ''}">${user?.role ?? 'UNKNOWN'}</span></td>
                    </tr>
                `).join('');
                tableWrapper.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Role</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                `;
                attachRowListeners();
                showStatus('Users loaded. Click a row to edit or delete.');
            } catch (error) {
                showStatus(`Unable to load users. ${error.message}`, true);
                tableWrapper.innerHTML = '';
            }
        }

        async function sendJson(url, method, body = null) {
            const options = {
                method,
                headers: { 'Content-Type': 'application/json' }
            };
            if (body) options.body = JSON.stringify(body);
            const response = await fetch(url, options);
            if (!response.ok) {
                throw new Error(`Request failed with status ${response.status}`);
            }
            return response;
        }

        async function createUser() {
            const firstName = firstNameInput.value.trim();
            const lastName = lastNameInput.value.trim();
            const dateNaissance = dateInput.value;
            const role = roleInput.value;
            if (!firstName || !lastName || !dateNaissance) {
                showStatus('First name, last name, and birth date are required.', true);
                return;
            }
            try {
                await sendJson(`${apiBase}/add-user`, 'POST', { firstName, lastName, dateNaissance, role });
                showStatus('User created successfully. Refreshing list...');
                clearForm();
                loadUsers();
            } catch (error) {
                showStatus(`Create failed. ${error.message}`, true);
            }
        }

        async function updateUser() {
            const id = idInput.value.trim();
            const firstName = firstNameInput.value.trim();
            const lastName = lastNameInput.value.trim();
            const dateNaissance = dateInput.value;
            const role = roleInput.value;
            if (!id) {
                showStatus('Enter the user ID to update.', true);
                return;
            }
            try {
                await sendJson(`${apiBase}/modify-user`, 'PUT', { id: Number(id), firstName, lastName, dateNaissance, role });
                showStatus('User updated successfully. Refreshing list...');
                clearForm();
                loadUsers();
            } catch (error) {
                showStatus(`Update failed. ${error.message}`, true);
            }
        }

        async function deleteUser() {
            const id = idInput.value.trim();
            if (!id) {
                showStatus('Enter the user ID to delete.', true);
                return;
            }
            try {
                await sendJson(`${apiBase}/remove-user/${id}`, 'DELETE');
                showStatus('User deleted successfully. Refreshing list...');
                clearForm();
                loadUsers();
            } catch (error) {
                showStatus(`Delete failed. ${error.message}`, true);
            }
        }

        createBtn.addEventListener('click', createUser);
        updateBtn.addEventListener('click', updateUser);
        deleteBtn.addEventListener('click', deleteUser);
        resetBtn.addEventListener('click', clearForm);

        loadUsers();
    </script>
</body>
</html>
