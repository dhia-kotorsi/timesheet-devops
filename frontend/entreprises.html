<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Companies - Timesheet DevOps</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="navbar">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="users.html">Users</a>
        <a class="nav-link" href="employes.html">Employees</a>
        <a class="nav-link" href="contrats.html">Contracts</a>
        <a class="nav-link" href="departements.html">Departments</a>
        <a class="nav-link" href="entreprises.html">Companies</a>
    </div>
    <div class="container">
        <div class="page-title">Companies</div>
        <div class="card">
            <div id="status" class="status"></div>
            <div id="table-wrapper" class="table-wrapper"></div>
        </div>
    </div>
    <script>
        const currentPage = window.location.pathname.split('/').pop();
        document.querySelectorAll('.nav-link').forEach(link => {
            if (link.getAttribute('href') === currentPage) {
                link.classList.add('active');
            }
        });
        function getApiBase(entity) {
            const hostname = window.location.hostname;
            const isLocal = hostname === 'localhost' || hostname === '127.0.0.1';
            const base = isLocal
                ? 'http://localhost:8082'
                : `${window.location.protocol}//${hostname.replace('-80.', '-8082.')}`;
            return `${base}/timesheet-devops/${entity}`;
        }

        const apiBase = getApiBase('entreprise');   

        async function loadCompanies() {
            const status = document.getElementById('status');
            const tableWrapper = document.getElementById('table-wrapper');
            status.innerHTML = `<div class="loading-box"><div class="spinner"></div><div>Loading companies...</div></div>`;
            tableWrapper.innerHTML = '';
            try {
                const response = await fetch('http://localhost:8082/timesheet-devops/entreprise/retrieve-all-entreprises');
                if (!response.ok) {
                    throw new Error(`Request failed with status ${response.status}`);
                }
                const data = await response.json();
                if (!Array.isArray(data) || data.length === 0) {
                    status.innerHTML = '';
                    tableWrapper.innerHTML = '<div class="empty-state">No companies were returned by the server.</div>';
                    return;
                }
                const rows = data.map(entreprise => `
                    <tr>
                        <td>${entreprise?.id ?? '-'}</td>
                        <td>${entreprise?.nomEntreprise ?? '-'}</td>
                        <td>${entreprise?.raisonSociale ?? '-'}</td>
                    </tr>
                `).join('');
                tableWrapper.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Fiscal ID</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                `;
                status.innerHTML = '';
            } catch (error) {
                status.innerHTML = `<div class="status error">Unable to load companies. ${error.message}</div>`;
                tableWrapper.innerHTML = '';
            }
        }

        loadCompanies();
    </script>
</body>
</html>
